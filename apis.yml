name: RangeForce
description: RangeForce is a cloud-based cyber range and hands-on cybersecurity training
  platform that helps organizations build, measure, and validate the defensive skills
  of their security teams. Through browser-based, real-tool exercises and simulated
  attack scenarios, RangeForce lets blue teams practice detection, incident response,
  and threat hunting in realistic environments and benchmark individual and team readiness.
  Founded in Estonia and backed by Techstars, the company serves enterprises, government
  agencies, and managed security service providers. RangeForce does not currently
  publish a public developer API, developer portal, or API reference.
